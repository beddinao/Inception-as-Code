services:

  nginx:
    image: nginx:1.28-alpine
    container_name: ${NAMES_PREFIX:-inception}_nginx
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /etc/ssl/certs/nginx.crt ]; then
          apk add openssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/ssl/private/nginx.key \
            -out /etc/ssl/certs/nginx.crt \
            -subj "/C=US/ST=State/L=City/O=Company/OU=IT/CN=example.com"
        fi
        exec nginx -g "daemon off;"
    depends_on:
      wordpress: 
        condition: service_healthy
    ports:
      - 443:443
      - 80:80
    networks:
      - inception
    volumes:
      - wordpress_source:/var/www/html
      - ${NGINX_CONF_PATH:-./nginx/nginx.conf}:/etc/nginx/nginx.conf
      # Uncomment to use your own certs (self signed is generated by default)
      # ${NGINX_CERT_KEY_PATH}:/etc/ssl/private/nginx.key
      # ${NGINX_CERT_PATH}:/etc/ssl/certs/nginx.crt
    restart: unless-stopped
  
  wordpress:
    image: wordpress:php8.3-fpm
    container_name: ${NAMES_PREFIX:-inception}_wordpress_fpm
    volumes:
      - wordpress_source:/var/www/html
    depends_on:
      mariadb: 
        condition: service_healthy
    networks:
      - inception
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      WORDPRESS_DB_NAME: wp
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mariadb:
    image: mariadb:11.8
    container_name: ${NAMES_PREFIX:-inception}_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: wp
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pma:
    image: phpmyadmin:5.2.3
    container_name: ${NAMES_PREFIX:-inception}_pma
    networks:
      - inception
    depends_on:
      mariadb: 
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: https://${HOST:?HOST is required}/phpmyadmin/
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s\n' 'SetEnvIf X-Forwarded-Proto "^https$$" HTTPS=on' \
          > /etc/apache2/conf-enabled/zz-proto.conf
        exec /docker-entrypoint.sh apache2-foreground
    restart: unless-stopped


volumes:
  wordpress_source:
    name: ${NAMES_PREFIX:-inception}_wordpress_source
  mariadb_data:
    name: ${NAMES_PREFIX:-inception}_mariadb_data

networks:
  inception:
    name: ${NAMES_PREFIX:-inception}_net