- name: UFW
  ansible.builtin.apt:
    name:
      - ufw
    state: present
    update_cache: yes

- name: Deny all Incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow all Outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: '22'

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: '80'

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: '443'

- name: Enable and start UFW
  community.general.ufw:
    state: enabled
