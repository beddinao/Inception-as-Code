- name: UFW
  ansible.builtin.apt:
    name:
      - ufw
    state: present
    update_cache: yes

- name: Enable and start UFW
  ansible.builtin.systemd_service:
    name: ufw
    enabled: true
    state: started
    
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: 22

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: 80

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: 443

- name: Enable firewall
  community.general.ufw:
    state: enabled