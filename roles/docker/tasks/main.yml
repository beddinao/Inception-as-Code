- name: Create APT keyrings dir 
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory

- name: Delete old Docker GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent

- name: Delete old Docker Sources list 
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: remove old docker packages
  ansible.builtin.apt:
    name:
      - containerd
      - docker-io
      - docker-compose
    state: absent 
    purge: yes

- name: Download Docker GPG Key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc

- name: Add Docker Repo
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes

- name: Install Docker, Docker-Compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
